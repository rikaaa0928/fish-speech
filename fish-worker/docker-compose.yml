services:
  fish-worker:
    build: .
    restart: unless-stopped
    shm_size: "32g"
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    env_file:
      - .env
    ports:
      - "9281:${SGLANG_PORT:-8000}"
    volumes:
      - ${HOST_MODEL_DIR:-./models}:${CONTAINER_MODEL_DIR:-/models}
      - ${HOST_CACHE_DIR:-./cache}:${CONTAINER_CACHE_DIR:-/cache}
